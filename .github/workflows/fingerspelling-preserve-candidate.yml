name: Preserve reviewed fingerspelling pilot
on:
  push:
    branches: [codex/asl-fingerspelling-2026-10-31]
    paths: ['.github/workflows/fingerspelling-preserve-candidate.yml']
permissions:
  contents: read
jobs:
  preserve:
    if: github.repository == 'adamjamiesimson/SignRelay'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fsboard-independent-ctc-candidate
          path: candidate
          github-token: ${{ github.token }}
          run-id: 41211037508
      - name: Verify reviewed ONNX and preserve blobs; never move a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path("candidate")
          model=(root/"model.onnx").read_bytes()
          expected="fbf35592acd849bf3b6b5621a23465ed134ffbc6ab049fbbf8db75916177c29a"
          assert len(model)==497759 and hashlib.sha256(model).hexdigest()==expected
          report=json.loads((root/"report.json").read_text())
          assert report["modelSha256"]==expected and report["test"]["edits"]==260 and report["test"]["sequences"]==96
          browser=json.loads((root/"browser-report.json").read_text())
          assert browser["passed"] and browser["modelSha256"]==expected
          mapping={"model.onnx":"public/models/asl-fingerspelling/fsboard-pilot-v1.onnx",
            "report.json":"docs/fingerspelling/evidence/fsboard-v13-pilot.json",
            "provenance.json":"docs/fingerspelling/evidence/fsboard-v13-provenance.json",
            "browser-report.json":"docs/fingerspelling/evidence/fsboard-v13-browser.json",
            "vocabulary.json":"docs/fingerspelling/evidence/fsboard-v13-vocabulary.json"}
          for name,path in mapping.items():
            raw=(root/name).read_bytes()
            payload=json.dumps({"content":base64.b64encode(raw).decode(),"encoding":"base64"}).encode()
            req=urllib.request.Request("https://api.github.com/repos/adamjamiesimson/SignRelay/git/blobs",data=payload,
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"},method="POST")
            with urllib.request.urlopen(req,timeout=45) as response: result=json.load(response)
            print("REVIEWED-BLOB",json.dumps({"path":path,"sha":result["sha"],"sha256":hashlib.sha256(raw).hexdigest(),"bytes":len(raw)}),flush=True)
          print("PILOT-SUMMARY",json.dumps({k:report[k] for k in ["train","validation","nativeOnnxParity","environment","evaluatedCounts","signerCounts"]}),flush=True)
          PY
