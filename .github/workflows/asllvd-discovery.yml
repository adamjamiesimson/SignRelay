name: Temporary ASLLVD benchmark discovery

on:
  push:
    branches:
      - feature/pretrained-language-expansion

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public ASLLVD metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://dai.cs.rutgers.edu/asllvd/signbank/asllvd_signs_2024_06_27.csv -o /tmp/asllvd.csv
          python - <<'PY'
          import csv, json
          p='/tmp/asllvd.csv'
          with open(p, newline='', encoding='utf-8-sig') as f:
              r=csv.DictReader(f)
              print('FIELDS', json.dumps(r.fieldnames))
              rows=list(r)
          print('ROWS', len(rows))
          needles=('HELLO','YES','SORRY','I-LOVE-YOU','PLEASE','THANK','NO')
          for row in rows:
              gloss=(row.get('main entry gloss label') or '').upper()
              variant=(row.get('entry/variant gloss label') or '').upper()
              klass=(row.get('Class Label') or '').upper()
              if any(n == gloss or n == variant or n == klass or (n in {'PLEASE','THANK'} and (n in gloss or n in variant or n in klass)) for n in needles):
                  print('MATCH', json.dumps(row, ensure_ascii=False))
          print('NEGATIVE_GESTURES')
          shown=0
          for row in rows:
              if 'GESTURE' in (row.get('sign type') or '').upper():
                  print('NEG', json.dumps(row, ensure_ascii=False))
                  shown += 1
                  if shown >= 12: break
          print('URL_CHECKS')
          for vid in ['4668','4670','4673','8973','8974','7912','7913','7914','4844','4845','201','203','6887','6890']:
              print('URL', vid, f'https://dai.cs.rutgers.edu/asllvd/signs_mov/{vid}.mp4')
          PY
      - name: Check selected clip URLs
        shell: bash
        run: |
          set -euo pipefail
          for id in 4668 4670 4673 8973 8974 7912 7913 7914 4844 4845 201 203 6887 6890; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' --retry 2 "https://dai.cs.rutgers.edu/asllvd/signs_mov/$id.mp4")
            echo "CLIP $id HTTP $code"
          done

      - name: Inspect ASLLVD public indexes for missing IDs
        shell: bash
        run: |
          set -euo pipefail
          for base in             https://dai.cs.rutgers.edu/asllvd/signbank/asllvd/             https://dai.cs.rutgers.edu/asllvd/signbank/asllvd/signs/             https://dai.cs.rutgers.edu/asllvd/signbank/asllvd/test/             https://dai.cs.rutgers.edu/asllvd/signs_mov_separ_signers/; do
            echo "INDEX $base"
            html=$(curl -fsSL --retry 2 "$base" || true)
            echo "$html" | grep -Eo 'href="[^"]+"' | sed 's/^href="//;s/"$//' | grep -E '(7912|7913|7914|8973|8974|4844|4845|203|6887|6890)' | head -80 || true
          done

      - name: Exact-match missing IDs in signer-separated index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          from html import unescape
          url='https://dai.cs.rutgers.edu/asllvd/signs_mov_separ_signers/'
          html=urllib.request.urlopen(url, timeout=30).read().decode('utf-8','replace')
          hrefs=[unescape(x) for x in re.findall(r'href="([^"]+)"', html)]
          ids=['7912','7913','7914','8973','8974','4844','4845','203','6887','6890','4670']
          for vid in ids:
              matches=[h for h in hrefs if re.search(rf'(?:^|_){re.escape(vid)}\.(?:mp4|webm)$', h)]
              print('EXACT', vid, matches)
          PY

      - name: Probe every target token URL
        shell: bash
        run: |
          set -euo pipefail
          for id in 4668 4669 4670 4671 4672 4673 4674 4675 4676 4844 4845 4846 7912 7913 7914 8973 8974 201 202 203 204 205 207767 6887 6888 6889 6890 6891 6892; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' --retry 2 "https://dai.cs.rutgers.edu/asllvd/signs_mov/$id.mp4")
            size=$(curl -L -sI "https://dai.cs.rutgers.edu/asllvd/signs_mov/$id.mp4" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
            echo "TARGET $id HTTP $code SIZE ${size:-unknown}"
          done

      - name: Discover deterministic cross-dataset ASL benchmark
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, re, urllib.request
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed

          csv_path='/tmp/asllvd.csv'
          with open('public/models/asl2000-tgcn/labels.json', encoding='utf-8') as f:
              model_labels=set(json.load(f))
          with open(csv_path, newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))

          grouped=defaultdict(list)
          for row in rows:
              label=(row.get('main entry gloss label') or '').strip().upper()
              if label not in model_labels: continue
              if (row.get('sign type') or '').strip() != 'Lexical Signs': continue
              if not re.fullmatch(r"[A-Z0-9][A-Z0-9 ']*", label): continue
              vid=(row.get('Video ID number') or '').strip()
              if not vid.isdigit(): continue
              grouped[label].append((int(vid), row))

          def rank(label):
              return hashlib.sha256(('signrelay-asllvd-v1|'+label).encode()).hexdigest()
          labels=sorted(grouped, key=rank)[:100]
          candidates=[]
          for label in labels:
              for vid,row in sorted(grouped[label], key=lambda x:x[0])[:3]:
                  candidates.append((rank(label),label,vid,row))

          def fetch(item):
              rnk,label,vid,row=item
              url=f'https://dai.cs.rutgers.edu/asllvd/signs_mov/{vid}.mp4'
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'SignRelay-research-evaluation/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data=resp.read()
                      if resp.status != 200 or len(data) < 10000: return None
                  return {
                    'id': f'asllvd-{vid}', 'language':'asl', 'trial_type':'sign',
                    'expected_gloss':label, 'video_id':str(vid), 'source_url':url,
                    'sha256':hashlib.sha256(data).hexdigest(), 'bytes':len(data),
                    'condition':'ASLLVD citation-form', 'source':'ASLLVD',
                    'full_video_file':row.get('full video file'),
                  }
              except Exception:
                  return None

          found=[]
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures=[pool.submit(fetch,item) for item in candidates]
              for future in as_completed(futures):
                  result=future.result()
                  if result: found.append(result)

          # One frozen clip per gloss for broad coverage; deterministic label order.
          by_label={}
          for item in sorted(found, key=lambda x:(rank(x['expected_gloss']), int(x['video_id']))):
              by_label.setdefault(item['expected_gloss'], item)
          selected=list(by_label.values())[:30]
          print('BENCH_COUNT', len(selected))
          for item in selected:
              print('BENCH', json.dumps(item, sort_keys=True))
          PY

      - name: Hash starter-rule benchmark clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/asllvd-starter
          for id in 4668 4671 4673 4674 201 204; do
            curl -fsSL --retry 3 "https://dai.cs.rutgers.edu/asllvd/signs_mov/$id.mp4" -o "/tmp/asllvd-starter/$id.mp4"
            bytes=$(wc -c < "/tmp/asllvd-starter/$id.mp4" | tr -d ' ')
            sha=$(sha256sum "/tmp/asllvd-starter/$id.mp4" | awk '{print $1}')
            echo "STARTER $id BYTES $bytes SHA256 $sha"
          done

      - name: Hash Apache-2.0 non-ASL gesture images
        shell: bash
        run: |
          set -euo pipefail
          rev=b453bf83fed4eb220051b3d45bf0b54cadbb7910
          mkdir -p /tmp/gesture-negatives
          for name in fist pointing_up thumb_up right_hands victory; do
            url="https://raw.githubusercontent.com/google-ai-edge/mediapipe/$rev/mediapipe/tasks/testdata/vision/$name.jpg"
            curl -fsSL --retry 3 "$url" -o "/tmp/gesture-negatives/$name.jpg"
            bytes=$(wc -c < "/tmp/gesture-negatives/$name.jpg" | tr -d ' ')
            sha=$(sha256sum "/tmp/gesture-negatives/$name.jpg" | awk '{print $1}')
            echo "NEGATIVE_IMAGE $name BYTES $bytes SHA256 $sha"
          done
