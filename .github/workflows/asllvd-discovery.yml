name: Temporary ASLLVD benchmark discovery

on:
  push:
    branches:
      - feature/pretrained-language-expansion

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public ASLLVD metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://dai.cs.rutgers.edu/asllvd/signbank/asllvd_signs_2024_06_27.csv -o /tmp/asllvd.csv
          python - <<'PY'
          import csv, json
          p='/tmp/asllvd.csv'
          with open(p, newline='', encoding='utf-8-sig') as f:
              r=csv.DictReader(f)
              print('FIELDS', json.dumps(r.fieldnames))
              rows=list(r)
          print('ROWS', len(rows))
          needles=('HELLO','YES','SORRY','I-LOVE-YOU','PLEASE','THANK','NO')
          for row in rows:
              gloss=(row.get('main entry gloss label') or '').upper()
              variant=(row.get('entry/variant gloss label') or '').upper()
              klass=(row.get('Class Label') or '').upper()
              if any(n == gloss or n == variant or n == klass or (n in {'PLEASE','THANK'} and (n in gloss or n in variant or n in klass)) for n in needles):
                  print('MATCH', json.dumps(row, ensure_ascii=False))
          print('LABELS_CONTAINING_NO')
          for label in sorted({(row.get('main entry gloss label') or '').upper() for row in rows}):
              if label == 'NO' or label.startswith('NO_') or label.startswith('NO-') or label in {'NOT','NONE'}:
                  print('LABEL', label)
          PY
