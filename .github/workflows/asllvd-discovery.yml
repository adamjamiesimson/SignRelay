name: Temporary ASLLVD benchmark discovery

on:
  push:
    branches:
      - feature/pretrained-language-expansion

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public ASLLVD metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://dai.cs.rutgers.edu/asllvd/signbank/asllvd_signs_2024_06_27.csv -o /tmp/asllvd.csv
          python - <<'PY'
          import csv, json
          p='/tmp/asllvd.csv'
          with open(p, newline='', encoding='utf-8-sig') as f:
              r=csv.DictReader(f)
              print('FIELDS', json.dumps(r.fieldnames))
              rows=list(r)
          print('ROWS', len(rows))
          needles=('HELLO','YES','SORRY','I-LOVE-YOU','PLEASE','THANK','NO')
          for row in rows:
              gloss=(row.get('main entry gloss label') or '').upper()
              variant=(row.get('entry/variant gloss label') or '').upper()
              klass=(row.get('Class Label') or '').upper()
              if any(n == gloss or n == variant or n == klass or (n in {'PLEASE','THANK'} and (n in gloss or n in variant or n in klass)) for n in needles):
                  print('MATCH', json.dumps(row, ensure_ascii=False))
          print('NEGATIVE_GESTURES')
          shown=0
          for row in rows:
              if 'GESTURE' in (row.get('sign type') or '').upper():
                  print('NEG', json.dumps(row, ensure_ascii=False))
                  shown += 1
                  if shown >= 12: break
          print('URL_CHECKS')
          for vid in ['4668','4670','4673','8973','8974','7912','7913','7914','4844','4845','201','203','6887','6890']:
              print('URL', vid, f'https://dai.cs.rutgers.edu/asllvd/signs_mov/{vid}.mp4')
          PY
      - name: Check selected clip URLs
        shell: bash
        run: |
          set -euo pipefail
          for id in 4668 4670 4673 8973 8974 7912 7913 7914 4844 4845 201 203 6887 6890; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' --retry 2 "https://dai.cs.rutgers.edu/asllvd/signs_mov/$id.mp4")
            echo "CLIP $id HTTP $code"
          done

      - name: Inspect ASLLVD public indexes for missing IDs
        shell: bash
        run: |
          set -euo pipefail
          for base in             https://dai.cs.rutgers.edu/asllvd/signbank/asllvd/             https://dai.cs.rutgers.edu/asllvd/signbank/asllvd/signs/             https://dai.cs.rutgers.edu/asllvd/signbank/asllvd/test/             https://dai.cs.rutgers.edu/asllvd/signs_mov_separ_signers/; do
            echo "INDEX $base"
            html=$(curl -fsSL --retry 2 "$base" || true)
            echo "$html" | grep -Eo 'href="[^"]+"' | sed 's/^href="//;s/"$//' | grep -E '(7912|7913|7914|8973|8974|4844|4845|203|6887|6890)' | head -80 || true
          done

      - name: Exact-match missing IDs in signer-separated index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          from html import unescape
          url='https://dai.cs.rutgers.edu/asllvd/signs_mov_separ_signers/'
          html=urllib.request.urlopen(url, timeout=30).read().decode('utf-8','replace')
          hrefs=[unescape(x) for x in re.findall(r'href="([^"]+)"', html)]
          ids=['7912','7913','7914','8973','8974','4844','4845','203','6887','6890','4670']
          for vid in ids:
              matches=[h for h in hrefs if re.search(rf'(?:^|_){re.escape(vid)}\.(?:mp4|webm)$', h)]
              print('EXACT', vid, matches)
          PY
