name: ASL benchmark tooling check

on:
  push:
    branches:
      - feature/asl-heldout-benchmark-2026-10-02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asl-heldout-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m py_compile training/prepare_asl_citizen_eval.py
      - name: Production Firebase build
        run: npm run build:firebase
      - name: Confirm evaluator tooling
        run: |
          node --check scripts/evaluate-video-regressions.mjs
          python training/prepare_asl_citizen_eval.py --help
          echo "Licensed ASL Citizen video is intentionally not fetched on GitHub-hosted infrastructure."
