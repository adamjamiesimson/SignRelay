name: ASL starter-rule diagnostic

on:
  push:
    branches:
      - research/asl-starter-rule-diagnostic

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Force ASL starter-rule-only mode for research
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('workers/recognition.worker.ts')
          s=p.read_text()
          s=s.replace('const classifier = language in classifiers ? classifiers[language as keyof typeof classifiers] : null;', 'const classifier = language === "asl" ? null : language in classifiers ? classifiers[language as keyof typeof classifiers] : null;')
          s=s.replace('const starterFallback = activeLanguage === "asl" && modelProblem ? starter : null;', 'const starterFallback = activeLanguage === "asl" ? starter : null;')
          p.write_text(s)
          PY
      - run: npm run eval:fetch-asllvd
      - run: npm run build:firebase
      - name: Run starter-only benchmark
        run: npm run eval:video -- evaluation/asllvd-v1.local.jsonl --output work/asl-starter-only/results.jsonl --report work/asl-starter-only/report.md
      - name: Print report
        run: cat work/asl-starter-only/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: asl-starter-rule-diagnostic
          path: |
            work/asl-starter-only/results.jsonl
            work/asl-starter-only/report.md
          if-no-files-found: error
