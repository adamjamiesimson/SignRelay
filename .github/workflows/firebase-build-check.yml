name: Firebase Static Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recover the reviewed Spanish training artifact when weights are absent
        if: hashFiles('public/models/lse300-swl/model.onnx') == ''
        uses: actions/download-artifact@v4
        with:
          name: lse300-candidate
          run-id: 35179535121
          github-token: ${{ github.token }}
          path: work/lse-recovery

      - name: Verify recovered Spanish weights
        if: hashFiles('public/models/lse300-swl/model.onnx') == ''
        run: |
          cp work/lse-recovery/public/models/lse300-swl/model.onnx public/models/lse300-swl/model.onnx
          node scripts/verify-lse-assets.mjs

      - name: Set up reproducible Bangla model conversion when weights are absent
        if: hashFiles('public/models/bdsl401-videomae/model.onnx') == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover and verify the pinned Bangla model
        if: hashFiles('public/models/bdsl401-videomae/model.onnx') == ''
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 transformers==4.48.3 safetensors==0.5.3 onnx==1.17.0 onnxruntime==1.20.1 opencv-python-headless==4.11.0.86
          python training/fetch_bdsl401_research_assets.py
          python training/export_bdsl401_onnx.py work/bdsl401-research/source work/bdsl401-research/clips
          python training/quantize_bdsl401_onnx.py work/bdsl401-export work/bdsl401-research/clips --weight-only --output work/bdsl401-weight-only
          python training/verify_bdsl_browser_preprocessing.py work/bdsl401-research/clips
          node scripts/benchmark-bdsl401-wasm.mjs int8 work/bdsl401-weight-only/model.int8.onnx work/bdsl401-weight-only
          node scripts/install-bdsl-model.mjs

      - name: Build Firebase static export
        run: npm run build:firebase

      - name: Verify export
        run: |
          test -d out
          test -f out/index.html
          test -f out/workers/ort-wasm-simd-threaded.jsep.wasm
          test -f out/workers/ort-wasm-simd-threaded.jsep.mjs
          echo "Static export created successfully."

      - name: Test recognition and model contracts
        run: npm test

      - name: Lint application source
        run: npm run lint

      - name: Verify Bangla camera flow in headless Chrome
        run: node tests/bdsl-browser-smoke.mjs "$(command -v google-chrome)"

      - name: Verify Spanish camera and model worker in headless Chrome
        run: node tests/lse-browser-smoke.mjs "$(command -v google-chrome)"

      - name: Audit dependencies, history and exported pages
        run: npm run audit:security

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signrelay-browser-evidence
          path: outputs/*-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: signrelay-firebase-out
          path: out
          retention-days: 3
