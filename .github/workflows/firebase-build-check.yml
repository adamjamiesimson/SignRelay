name: Firebase Static Build Check

on:
  push:
    branches:
      - main
  # Every PR base, including stacked feature branches; the export and browser
  # smokes otherwise run only once a stack is retargeted to main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recover the reviewed Spanish training artifact when weights are absent
        if: hashFiles('public/models/lse300-swl/model.onnx') == ''
        uses: actions/download-artifact@v4
        with:
          name: lse300-candidate
          run-id: 35179535121
          github-token: ${{ github.token }}
          path: work/lse-recovery

      - name: Verify recovered Spanish weights
        if: hashFiles('public/models/lse300-swl/model.onnx') == ''
        run: |
          cp work/lse-recovery/public/models/lse300-swl/model.onnx public/models/lse300-swl/model.onnx
          node scripts/verify-lse-assets.mjs

      - name: Set up reproducible Bangla model conversion when weights are absent
        if: hashFiles('public/models/bdsl401-videomae/model.onnx') == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover and verify the pinned Bangla model
        if: hashFiles('public/models/bdsl401-videomae/model.onnx') == ''
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 transformers==4.48.3 safetensors==0.5.3 onnx==1.17.0 onnxruntime==1.20.1 opencv-python-headless==4.11.0.86
          python training/fetch_bdsl401_research_assets.py
          python training/export_bdsl401_onnx.py work/bdsl401-research/source work/bdsl401-research/clips
          python training/quantize_bdsl401_onnx.py work/bdsl401-export work/bdsl401-research/clips --weight-only --output work/bdsl401-weight-only
          python training/verify_bdsl_browser_preprocessing.py work/bdsl401-research/clips
          node scripts/benchmark-bdsl401-wasm.mjs int8 work/bdsl401-weight-only/model.int8.onnx work/bdsl401-weight-only
          node scripts/install-bdsl-model.mjs

      - name: Build Firebase static export
        run: npm run build:firebase

      - name: Verify export
        run: |
          test -d out
          test -f out/index.html
          test -f out/workers/ort-wasm-simd-threaded.jsep.wasm
          test -f out/workers/ort-wasm-simd-threaded.jsep.mjs
          test ! -e out/field-test.html
          test -f out/vision/wasm/vision_wasm_internal.wasm
          test -f out/vision/models/gesture_recognizer.task
          test ! -e out/.signrelay-private-capture-included
          echo "Static export created successfully."

      - name: Test recognition and model contracts
        run: npm test

      - name: Lint application source
        run: npm run lint

      - name: Verify workspace switching, storage failures and delayed camera grants
        run: node tests/workspace-browser-smoke.mjs "$(command -v google-chrome)"

      - name: Verify cancelled model runs and cached session reuse in Chrome
        run: node tests/landmark-lifecycle-browser-smoke.mjs "$(command -v google-chrome)"

      - name: Verify Russian camera and model worker in headless Chrome
        run: node tests/rsl-browser-smoke.mjs "$(command -v google-chrome)"

      - name: Verify Bangla camera flow in headless Chrome
        run: node tests/bdsl-browser-smoke.mjs "$(command -v google-chrome)"

      - name: Verify Spanish camera and model worker in headless Chrome
        run: node tests/lse-browser-smoke.mjs "$(command -v google-chrome)"

      - name: Start ASL vision with CDNs blocked (self-hosted MediaPipe runtime)
        run: node tests/offline-vision-smoke.mjs "$(command -v google-chrome)"

      - name: Automated WCAG 2.x A/AA checks (axe-core, not added to the lockfile)
        run: |
          npm install --no-save axe-core@4.10.3
          node tests/a11y-axe-smoke.mjs "$(command -v google-chrome)" node_modules/axe-core/axe.min.js

      # Build verification: everything audit:security checks except the strict
      # npm advisory gate, which runs as its own job below so a passing export
      # is not reported as one opaque failure (and the gate is not weakened).
      - name: Secret scan, rendered export and fail-closed dependency gate
        run: |
          npm run audit:secrets
          npm run test:rendered
          npm run audit:deps

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signrelay-browser-evidence
          path: outputs/*-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: signrelay-firebase-out
          path: out
          retention-days: 3

  # Strict zero-advisory release gate, unchanged: `npm run audit:security`
  # against the exact export built above. It stays red while any advisory is
  # reported (currently the reviewed dev-only braces chain); accepting that is
  # an owner decision, not something CI configuration may waive.
  strict-dependency-audit:
    name: Strict dependency audit (release gate)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: signrelay-firebase-out
          path: out
      - name: npm audit --audit-level=moderate, secret scan and exported pages
        run: npm run audit:security
