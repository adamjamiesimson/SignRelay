name: Temporary ASL adapter matrix

on:
  push:
    branches:
      - feature/pretrained-language-expansion

permissions:
  contents: read

jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, swap-hands, mirror-x, swap-hands-mirror-x]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Apply adapter variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('lib/asl1000-runtime.ts')
          text = path.read_text()
          variant = os.environ['VARIANT']

          if variant in {'swap-hands', 'swap-hands-mirror-x'}:
              old = 'return [...body, ...handPoints(frame, "Left"), ...handPoints(frame, "Right")];'
              new = 'return [...body, ...handPoints(frame, "Right"), ...handPoints(frame, "Left")];'
              if old not in text:
                  raise SystemExit('hand ordering anchor not found')
              text = text.replace(old, new)

          if variant in {'mirror-x', 'swap-hands-mirror-x'}:
              old = 'result[offset] = 2 * (point.x - 0.5);'
              new = 'result[offset] = 2 * ((1 - point.x) - 0.5);'
              if old not in text:
                  raise SystemExit('x normalization anchor not found')
              text = text.replace(old, new)

          path.write_text(text)
          print(f'Applied {variant}')
          PY
      - run: npm run eval:fetch-asllvd
      - run: npm run build:firebase
      - name: Run benchmark
        run: npm run eval:video -- evaluation/asllvd-v1.local.jsonl --output work/asllvd/${{ matrix.variant }}/results.jsonl --report work/asllvd/${{ matrix.variant }}/report.md
      - name: Print report
        run: cat work/asllvd/${{ matrix.variant }}/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: asllvd-${{ matrix.variant }}
          path: |
            work/asllvd/${{ matrix.variant }}/results.jsonl
            work/asllvd/${{ matrix.variant }}/report.md
          if-no-files-found: error
