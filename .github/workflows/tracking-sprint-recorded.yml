name: Tracking sprint - recorded RGB against PR 51
# PR #51 head (7009705) versus this branch on the same runner, alternating per
# case, over the established exposed regression catalogs. The only production
# difference is the fingerspelling tracker configuration (one-hand landmarker).
on:
  push:
    branches: [claude/charming-thompson-2aql9w-tracking]
    paths: ['.github/workflows/tracking-sprint-recorded.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: positive, repeat: 1}
          - {kind: positive, repeat: 2}
          - {kind: positive, repeat: 3}
          - {kind: negative, repeat: 1}
          - {kind: negative, repeat: 2}
          - {kind: rare-original, repeat: 1}
          - {kind: rare-original, repeat: 2}
          - {kind: rare-mirrored, repeat: 1}
          - {kind: rare-mirrored, repeat: 2}
    env: {OMP_NUM_THREADS: '2', OPENBLAS_NUM_THREADS: '1', TF_CPP_MIN_LOG_LEVEL: '2', PYTHONUNBUFFERED: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, path: harness}
      - uses: actions/checkout@v4
        with: {persist-credentials: false, path: baseline, ref: '7009705332d2020cb4d07c8db7e685a86d587c81'}
      - uses: actions/checkout@v4
        with: {persist-credentials: false, path: candidate}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y libgles2 libegl1 libgl1 ffmpeg
      - run: python -m pip install --disable-pip-version-check -r harness/training/fingerspelling/requirements.txt
      - name: Identical lockfile in both implementations (the tracker configuration is the variable)
        run: |
          cmp baseline/package-lock.json candidate/package-lock.json
          for implementation in baseline candidate; do
            (cd "$implementation" && npm ci && npm run build:rehearsal)
          done
      - name: Alternate every predetermined RGB input on this runner
        env: {REPEAT: '${{ matrix.repeat }}', CATALOG: '${{ matrix.kind }}'}
        run: python harness/scripts/diagnostics/sprint-paired-replay.py "$CATALOG" "$(command -v google-chrome)" --baseline baseline --candidate candidate --out outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-${{ matrix.kind }}-${{ matrix.repeat }}
          path: outputs/*.json
          retention-days: 14
  summary:
    needs: paired
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'tracking-*', path: ledgers}
      - name: Aggregate (no identifiers, references, predictions or landmarks)
        run: |
          find ledgers -name '*.json' -exec sha256sum {} + | sed 's#ledgers/##' | sort -k2
          python scripts/diagnostics/summarize-pr51-recorded.py ledgers outputs/tracking-recorded-summary.json > /dev/null
          echo "TRACKING-RECORDED-SUMMARY-BEGIN"; python -c "import json;d=json.load(open('outputs/tracking-recorded-summary.json'));d['catalogs']={k:{kk:vv for kk,vv in v.items() if kk!='cases'} for k,v in d['catalogs'].items()};print(json.dumps(d))"; echo "TRACKING-RECORDED-SUMMARY-END"
      - uses: actions/upload-artifact@v4
        with: {name: tracking-recorded-summary, path: outputs/tracking-recorded-summary.json, retention-days: 30}
