name: ASL-2000 Recognition Diagnostics (non-release)

# Sprint 8 root-cause evaluation of the shipped WLASL2000 Pose-TGCN.
# A: publisher OpenPose keypoints (official checkpoint vs shipped int8 model,
#    and the same keypoints through SignRelay's adapter variants).
# B: the same WLASL test videos (direct, non-YouTube sources) through MediaPipe
#    Tasks and SignRelay's adapter, plus geometry against the publisher's keypoints.
# C: those clips replayed through the production vision engine and worker in
#    Chrome, and the complete live frame sequences through the isolated evaluator.
#
# Data terms: WLASL C-UDA 1.0 (academic/computational use only), the same terms
# under which the shipped checkpoint is used. Raw videos, keypoints and
# landmarks stay on the runner; only aggregate metrics and per-instance
# predictions (labels, ranks, scores) are printed and uploaded.
on:
  # A short, fail-closed source check on PRs; full research stays opt-in/push
  # on its existing research branch and never runs on a schedule.
  pull_request:
    paths:
      - '.github/workflows/asl2000-diagnostics.yml'
      - 'training/secure_download.py'
      - 'training/fetch_popsign_sample.py'
      - 'training/complete_popsign_chain.sh'
      - 'scripts/asl2000-eval/complete-ca-chain.sh'
  workflow_dispatch:
    inputs:
      browser_clips:
        description: 'Maximum clips replayed in Chrome (condition C)'
        default: '120'
  push:
    branches:
      - claude/festive-dirac-pbwx2j
    paths:
      - '.github/workflows/asl2000-diagnostics.yml'
      - 'training/asl2000_conditions.py'
      - 'training/tgcn_packed.py'
      - 'training/fetch_popsign_sample.py'
      - 'training/secure_download.py'
      - 'training/complete_popsign_chain.sh'
      - 'scripts/asl2000-eval/complete-ca-chain.sh'
      - 'scripts/asl2000-eval/**'
      - 'lib/tgcn-input.ts'
      - 'lib/asl1000-runtime.ts'
      - 'docs/evaluation/asl2000-sprint8/frozen-sample.json'

permissions:
  contents: read

concurrency:
  group: asl2000-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  popsign-source-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PopSign trust and bounded directory retrieval
        run: |
          bash training/complete_popsign_chain.sh "$RUNNER_TEMP/popsign-ca.pem"
          export SSL_CERT_FILE="$RUNNER_TEMP/popsign-ca.pem"
          PYTHONPATH=training python -c 'from secure_download import get; print("Verified listing bytes:", len(get("https://signdata.cc.gatech.edu/data/popsign_v1_0/game/test/")))'

  diagnostics:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      # Only to commit the derived reports (metrics and predictions; no media,
      # keypoints or landmarks) back to this diagnostics branch.
      contents: write
    env:
      DATA: ${{ github.workspace }}/../wlasl-data
      WORK: ${{ github.workspace }}/evaluation/raw/asl2000-sprint8
      REPORTS: ${{ github.workspace }}/evaluation/derived/asl2000-sprint8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2
          python -m pip install --disable-pip-version-check numpy opencv-python-headless mediapipe
          node scripts/install-vision-assets.mjs
          mkdir -p "$DATA" "$WORK" "$REPORTS"
          df -h . "$DATA"

      - name: Download publisher WLASL data (C-UDA; stays on this runner)
        run: |
          set -euo pipefail
          cd "$DATA"
          fetch() { curl -fL --retry 4 --retry-delay 10 -o "$1" "https://drive.usercontent.google.com/download?id=$2&export=download&confirm=t"; }
          fetch archived.zip 1dzvocsaylRsjqaY4r_lyRihPZn0I6AA_
          fetch splits.zip 16CWkbMLyEbdBkrxAPaxSXFP_aSxKzNN4
          fetch pose.zip 1k5mfrc2g4ZEzzNjW6CEVjLvNTZcmPanB
          curl -fL --retry 4 -o WLASL_v0.3.json https://raw.githubusercontent.com/dxli94/WLASL/master/start_kit/WLASL_v0.3.json
          ls -la
          unzip -q archived.zip -d checkpoints
          unzip -q splits.zip -d splits
          find checkpoints splits -maxdepth 3 | head -30
          unzip -l pose.zip | head -5
          python - <<'EOF'
          import hashlib, json
          frozen = json.load(open("${{ github.workspace }}/docs/evaluation/asl2000-sprint8/frozen-sample.json"))
          actual = hashlib.sha256(open("WLASL_v0.3.json", "rb").read()).hexdigest()
          assert actual == frozen["source_index"]["sha256"], "WLASL index differs from the one the sample was frozen against"
          print("Frozen sample index verified", actual)
          EOF

      - name: Bundle the isolated evaluator (production TypeScript)
        run: |
          npx esbuild scripts/asl2000-eval/preprocess.ts scripts/asl2000-eval/infer.ts scripts/asl2000-eval/live-cases.ts \
            --bundle --platform=node --format=esm --outdir="$WORK/bin" --out-extension:.js=.mjs

      - name: Condition A — publisher keypoints
        run: |
          python training/asl2000_conditions.py official \
            --split "$(find "$DATA/splits" -name asl2000.json | head -1)" \
            --poses "$DATA/pose.zip" \
            --checkpoint "$(find "$DATA/checkpoints" -path '*asl2000*' -name 'ckpt.pth' | head -1)" \
            --node-preprocess "$WORK/bin/preprocess.mjs" --node-infer "$WORK/bin/infer.mjs" \
            --workdir "$WORK/a" --output "$REPORTS/condition-a.json" --parity 32

      - name: Condition B — the same test videos through MediaPipe
        run: |
          python training/asl2000_conditions.py mediapipe \
            --split "$(find "$DATA/splits" -name asl2000.json | head -1)" \
            --poses "$DATA/pose.zip" --index "$DATA/WLASL_v0.3.json" \
            --videos "$DATA/videos" --framing "$REPORTS/condition-a.json" \
            --node-preprocess "$WORK/bin/preprocess.mjs" \
            --workdir "$WORK/b" --output "$REPORTS/condition-b.json"

      - name: Condition P — PopSign ASL (CC BY 4.0) other signers, phones and out-of-vocabulary signs
        id: popsign
        # A PopSign outage must not skip the browser replay of the WLASL clips.
        continue-on-error: true
        run: |
          bash training/complete_popsign_chain.sh "$RUNNER_TEMP/popsign-ca.pem"
          export SSL_CERT_FILE="$RUNNER_TEMP/popsign-ca.pem"
          python training/fetch_popsign_sample.py public/models/asl2000-tgcn/labels.json \
            "$DATA/popsign" "$WORK/popsign-clips.json" --split test --in-vocab 40 --signers 6
          python training/asl2000_conditions.py clips --clips "$WORK/popsign-clips.json" \
            --framing "$REPORTS/condition-a.json" --node-preprocess "$WORK/bin/preprocess.mjs" \
            --workdir "$WORK/p" --output "$REPORTS/condition-p.json"

      - name: Condition C — live browser pipeline on the same clips
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium)"
          python - <<'EOF'
          import json, os
          clips = json.load(open(os.environ["WORK"] + "/b/clips.json"))
          order = {"everyday": 0}
          clips.sort(key=lambda c: (order.get(c["group"], 1 if c["group"].startswith("tier") else 2)))
          seen, chosen = set(), []
          for clip in clips:
              if clip["id"] not in seen:
                  seen.add(clip["id"]); chosen.append(clip)
          limit = int("${{ inputs.browser_clips || '120' }}")
          chosen = chosen[:limit]
          # PopSign: two signers per sign, in and out of vocabulary.
          path = os.environ["WORK"] + "/popsign-clips.json"
          popsign, per_sign = (json.load(open(path)) if os.path.exists(path) else []), {}
          for clip in popsign:
              per_sign[clip["gloss"]] = per_sign.get(clip["gloss"], 0) + 1
              if per_sign[clip["gloss"]] <= 2:
                  chosen.append({key: clip[key] for key in ("id", "file", "gloss", "group")})
          json.dump(chosen, open(os.environ["WORK"] + "/c-clips.json", "w"))
          print(len(chosen), "clips for the browser replay")
          EOF
          # v1: the worker bundle shipped at the PR #46 head. candidate: this commit, rebuilt from source.
          git show 6eb9c64a1ed33a3f2d64f62e4d5363bde824ffdb:public/workers/recognition.worker.js > public/workers/v1-recognition.worker.js
          npm run build:worker
          node scripts/asl2000-eval/browser-run.mjs "$chrome" "$WORK/c-clips.json" "$WORK/c-captures" \
            v1=/workers/v1-recognition.worker.js candidate=/workers/recognition.worker.js --pause=1000 \
            > "$REPORTS/condition-c-worker-log.jsonl"
          tail -5 "$REPORTS/condition-c-worker-log.jsonl"
          node "$WORK/bin/live-cases.mjs" "$WORK/c-captures" "$WORK/c-cases.jsonl" "$REPORTS/condition-c-outcomes.jsonl"
          python training/asl2000_conditions.py live \
            --cases "$WORK/c-cases.jsonl" --outcomes "$REPORTS/condition-c-outcomes.jsonl" \
            --clips "$WORK/c-clips.json" --framing "$REPORTS/condition-a.json" \
            --node-preprocess "$WORK/bin/preprocess.mjs" \
            --workdir "$WORK/c" --output "$REPORTS/condition-c.json"

      - name: Store derived reports (no media, keypoints or landmarks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asl2000-diagnostics-derived
          path: |
            evaluation/derived/asl2000-sprint8/*.json
            evaluation/derived/asl2000-sprint8/*.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Report blocked PopSign condition after independent WLASL diagnostics
        if: always() && steps.popsign.outcome == 'failure'
        run: |
          echo '## Condition P blocked' >> "$GITHUB_STEP_SUMMARY"
          echo 'PopSign acquisition/evaluation failed. Independent WLASL reports are retained; this run is incomplete and cannot validate release.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Commit derived reports to this branch (no media, keypoints or landmarks)
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="docs/evaluation/asl2000-sprint8/runs/${GITHUB_RUN_ID}"
          mkdir -p "$out"
          for file in "$REPORTS"/*; do
            case "$file" in
              *.jsonl) gzip -9 -c "$file" > "$out/$(basename "$file").gz" ;;
              *) cp "$file" "$out/" ;;
            esac
          done
          git config user.name "signrelay-diagnostics"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "eval: ASL-2000 diagnostics run ${GITHUB_RUN_ID} derived reports" -m "Source commit ${GITHUB_SHA}. Metrics and per-instance predictions only."
          for attempt in 1 2 3 4; do
            git pull --rebase "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
              && git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((attempt * 5))
          done
