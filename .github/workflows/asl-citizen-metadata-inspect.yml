name: Inspect ASL Citizen archive metadata

on:
  push:
    branches:
      - research/asl-citizen-stgcn

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet remotezip
      - name: Range-read archive metadata only
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          import csv, io, json, hashlib

          url = 'https://download.microsoft.com/download/b/8/8/b88c0bae-e6c1-43e1-8726-98cf5af36ca4/ASL_Citizen.zip'
          with RemoteZip(url) as rz:
              infos = rz.infolist()
              names = [i.filename for i in infos]
              csv_names = [n for n in names if n.lower().endswith('.csv')]
              print('archive_entries', len(names))
              print('csv_entries', json.dumps(csv_names, indent=2))
              report = {'archive_entries': len(names), 'csvs': []}
              for name in csv_names:
                  raw = rz.read(name)
                  text = raw.decode('utf-8-sig')
                  rows = list(csv.reader(io.StringIO(text)))
                  header = rows[0] if rows else []
                  item = {
                      'name': name,
                      'bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'rows': max(0, len(rows)-1),
                      'header': header,
                  }
                  # Derive only non-personal aggregate/class information.
                  lower = [h.strip().lower() for h in header]
                  gloss_idx = next((i for i,h in enumerate(lower) if h in {'gloss','label','sign'}), None)
                  if gloss_idx is not None:
                      glosses = sorted({r[gloss_idx].strip() for r in rows[1:] if len(r)>gloss_idx and r[gloss_idx].strip()})
                      item['unique_glosses'] = len(glosses)
                      item['gloss_list_sha256'] = hashlib.sha256('\n'.join(glosses).encode()).hexdigest()
                      item['first_20_glosses'] = glosses[:20]
                  report['csvs'].append(item)
              Path('/tmp/asl-citizen-metadata-report.json').write_text(json.dumps(report, indent=2))
              print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asl-citizen-archive-metadata-report
          path: /tmp/asl-citizen-metadata-report.json
          if-no-files-found: error
