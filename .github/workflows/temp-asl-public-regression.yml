name: Temporary ASL public regression

on:
  push:
    branches:
      - feature/real-video-evaluation-2026-10-02

permissions:
  contents: read

concurrency:
  group: asl-public-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci
      - run: npm run build:firebase

      - name: Install media tools and verify browser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check yt-dlp
          google-chrome --version || chromium --version
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Fetch uncommitted public regression clips
        run: node scripts/fetch-asl-public-regression.mjs

      - name: Run real browser regression
        continue-on-error: true
        run: npm run eval:video -- evaluation/asl-public-regression.local.jsonl --language asl --strict --tail 4500

      - name: Upload metadata-only evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asl-public-regression-report
          path: |
            work/video-evaluation/
            evaluation/videos/asl-public-regression/availability.json
          if-no-files-found: error
          retention-days: 7
