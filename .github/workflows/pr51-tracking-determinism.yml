name: PR 51 real-hand tracker determinism
# Lockstep production tracker on licensed FSboard frames under controlled
# schedules. Exposed regression clips; determinism evidence, not accuracy.
on:
  push:
    branches: [claude/charming-thompson-2aql9w]
    paths: ['.github/workflows/pr51-tracking-determinism.yml', 'scripts/diagnostics/tracking-determinism-*']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: {OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', TF_CPP_MIN_LOG_LEVEL: '2', PYTHONUNBUFFERED: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y libgles2 libegl1 libgl1 ffmpeg
      - run: python -m pip install --disable-pip-version-check -r training/fingerspelling/requirements.txt
      - name: Verified licensed frames (runner-local; never uploaded)
        run: python scripts/diagnostics/tracking-determinism-prepare.py
      - run: npm ci && npm run build:rehearsal
      - name: Lockstep production tracker under controlled schedules
        run: node scripts/diagnostics/run-tracking-determinism.mjs "$(command -v google-chrome)" outputs/tracking-determinism-rgb.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Counts, deltas, CER and fingerprints only: no frames, landmarks, text or clip ids.
          name: pr51-tracking-determinism
          path: outputs/tracking-determinism-rgb.json
          retention-days: 14
