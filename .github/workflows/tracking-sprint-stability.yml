name: Tracking sprint - temporal stability grid on licensed frames
# Decoded-output sensitivity to which frames are tracked, per tracker
# configuration. Exposed regression clips; frames never leave the runner.
on:
  push:
    branches: [claude/charming-thompson-2aql9w-tracking]
    paths: ['.github/workflows/tracking-sprint-stability.yml', 'scripts/diagnostics/stability-grid-rgb.ts']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: {OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', TF_CPP_MIN_LOG_LEVEL: '2', PYTHONUNBUFFERED: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y libgles2 libegl1 libgl1 ffmpeg
      - run: python -m pip install --disable-pip-version-check -r training/fingerspelling/requirements.txt
      - name: Verified licensed frames (runner-local; never uploaded)
        run: python scripts/diagnostics/tracking-determinism-prepare.py
      - run: npm ci && npm run build:rehearsal
      - run: lscpu | head -20
      - name: Lockstep schedule perturbations per tracker configuration
        run: node scripts/diagnostics/run-stability-grid.mjs "$(command -v google-chrome)" outputs/stability-grid-rgb.json gesture:2,landmarker:2,landmarker:1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tracking-sprint-stability, path: outputs/stability-grid-rgb.json, retention-days: 14}
