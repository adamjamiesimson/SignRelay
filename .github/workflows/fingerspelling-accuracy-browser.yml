name: Fingerspelling paired browser inference and memory
on:
  push:
    branches: [codex/asl-fingerspelling-2026-10-31]
    paths: ['.github/workflows/fingerspelling-accuracy-browser.yml', 'scripts/diagnostics/fingerspelling-accuracy-*']
permissions: {contents: read, actions: read}
jobs:
  genuine-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0', cache: npm}
      - run: npm ci
      - run: node scripts/copy-onnx-runtime.mjs
      - uses: actions/download-artifact@v4
        with:
          name: accuracy-final-evidence-and-browser-inputs
          path: work/accuracy-evaluation
          github-token: ${{ github.token }}
          run-id: 41276657740
      - name: Real native/JS features, logits, beam, calibration and paired memory
        run: node scripts/diagnostics/fingerspelling-accuracy-browser.mjs "$(command -v google-chrome)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-paired-browser-evidence
          path: work/accuracy-evaluation/browser-report.json
          if-no-files-found: warn
          retention-days: 14
