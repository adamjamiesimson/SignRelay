name: Temporary security dependency refresh

on:
  push:
    branches:
      - fix/security-audit-2026-10-11

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install baseline dependencies
        run: npm ci

      - name: Upgrade Next.js and corresponding lint config
        run: npm install --save-exact next@16.4.0 eslint-config-next@16.4.0

      - name: Apply non-breaking dependency fixes
        run: npm audit fix --package-lock-only
        continue-on-error: true

      - name: Verify lockfile with clean install
        run: npm ci

      - name: Verify types, tests, lint and worker
        run: |
          npm run typecheck
          npm test
          npm run lint
          npm run build:worker

      - name: Report remaining vulnerabilities without suppressing findings
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Save validated package manifests on this isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes detected."
          else
            git commit -m "chore(security): update Next.js and lockfile [skip ci]"
            git push origin HEAD:fix/security-audit-2026-10-11
          fi
