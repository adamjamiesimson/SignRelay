name: WLASL raw-ranking diagnostic

on:
  push:
    branches:
      - research/wlasl-raw-diagnostic

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Disable ASL rejection gates for diagnostic only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/asl1000-runtime.ts')
          s=p.read_text()
          s=s.replace('const MODEL_MIN_CONFIDENCE = 0.62;', 'const MODEL_MIN_CONFIDENCE = 0;')
          s=s.replace('const MODEL_MIN_MARGIN = 0.22;', 'const MODEL_MIN_MARGIN = -1;')
          p.write_text(s)
          p=Path('workers/recognition.worker.ts')
          s=p.read_text().replace('const CONFIDENCE_THRESHOLD = 0.62;', 'const CONFIDENCE_THRESHOLD = 0;')
          p.write_text(s)
          PY
      - run: npm run eval:fetch-asllvd
      - run: npm run build:firebase
      - name: Run raw-ranking browser diagnostic
        run: npm run eval:video -- evaluation/asllvd-v1.local.jsonl --output work/wlasl-raw/results.jsonl --report work/wlasl-raw/report.md
      - name: Print report
        run: cat work/wlasl-raw/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: wlasl-raw-ranking-diagnostic
          path: |
            work/wlasl-raw/results.jsonl
            work/wlasl-raw/report.md
          if-no-files-found: error
