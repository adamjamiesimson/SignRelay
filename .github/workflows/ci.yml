name: Core CI

on:
  push:
    branches:
      - main
  # Stacked feature PRs target other feature branches. Run on every PR base so
  # a retargeted PR cannot silently skip typecheck, tests and lint.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Typecheck, test, lint, worker, repo guard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dataset acquisition and artifact regression tests
        run: |
          python -m pip install numpy
          python -m unittest discover -s training -p 'test_secure_download.py' -v
          python -m unittest discover -s training -p 'test_landmark_artifacts.py' -v
          bash tests/ca-chain-regression.sh

      - name: Unit and regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build recognition workers
        run: npm run build:worker

      - name: Compare pre-optimization and bounded DTW (synthetic CPU baseline)
        run: |
          npx esbuild scripts/benchmarks/personal-dtw.ts --bundle --platform=node --format=esm --outfile=/tmp/signrelay-personal-benchmark.mjs
          node /tmp/signrelay-personal-benchmark.mjs

      - name: Benchmark matching isolation and actual PSL references
        run: node scripts/benchmarks/matching-isolation.mjs

      - name: Check for accidental secrets
        run: npm run audit:secrets

      - name: Dependency advisories (production fail-closed, reviewed dev exceptions expire)
        run: npm run audit:deps

      - name: Enforce repository asset policy
        run: npm run repo:guard
