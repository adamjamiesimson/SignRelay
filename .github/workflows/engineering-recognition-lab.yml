name: Engineering sprint recognition laboratory
on:
  push:
    branches: [codex/engineering-sprint-2026-11-02]
    paths: ['.github/workflows/engineering-recognition-lab.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0', cache: npm}
      - run: npm ci
      - run: mkdir -p outputs && npm run build:rehearsal
      - name: Paired synthetic CPU and real-browser workers (not recognition accuracy)
        run: |
          node --expose-gc scripts/benchmarks/personal-sprint.mjs --out outputs/personal-paired.json
          node scripts/benchmarks/sprint-browser.mjs "$(command -v google-chrome)" outputs/browser-paired.json
      - name: Ten-minute worker memory, queues, matching and language-switch stress
        env:
          LONG_SESSION_SECONDS: '600'
          LONG_SESSION_ONLY: '300 personal examples, language switch and idle every 30 s'
        run: node scripts/benchmarks/long-session.mjs --out outputs/long-session.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: sprint-performance, path: 'outputs/*.json'}
  recorded-rgb:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: positive, variant: baseline, repeat: 1}
          - {kind: positive, variant: candidate, repeat: 1}
          - {kind: positive, variant: baseline, repeat: 2}
          - {kind: positive, variant: candidate, repeat: 2}
          - {kind: positive, variant: baseline, repeat: 3}
          - {kind: positive, variant: candidate, repeat: 3}
          - {kind: negative, variant: baseline, repeat: 1}
          - {kind: negative, variant: candidate, repeat: 1}
    env: {OMP_NUM_THREADS: '2', OPENBLAS_NUM_THREADS: '1', TF_CPP_MIN_LOG_LEVEL: '2', PYTHONUNBUFFERED: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, path: harness}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: implementation
          ref: ${{ matrix.variant == 'baseline' && '116fe686f7b31ecd00ac57ee4724287affafda0f' || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y libgles2 libegl1 libgl1 ffmpeg
      - name: Frozen dependencies and identical instrumentation
        working-directory: implementation
        run: |
          python -m pip install --disable-pip-version-check -r training/fingerspelling/requirements.txt
          npm ci
          cp ../harness/scripts/diagnostics/sprint-recorded-replay.py scripts/diagnostics/sprint-recorded-replay.py
      - run: npm run build:rehearsal
        working-directory: implementation
      - name: Every predetermined case, retaining failures and native/browser parity
        working-directory: implementation
        env: {VARIANT: '${{ matrix.variant }}', REPEAT: '${{ matrix.repeat }}', CATALOG: '${{ matrix.kind }}'}
        run: python scripts/diagnostics/sprint-recorded-replay.py "$CATALOG" "$(command -v google-chrome)" --out outputs/sprint-recorded-ledger.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-rgb-${{ matrix.kind }}-${{ matrix.variant }}-${{ matrix.repeat }}
          path: implementation/outputs/sprint-recorded-ledger.json
