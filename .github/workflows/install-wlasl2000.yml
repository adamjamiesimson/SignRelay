name: Install official WLASL2000 browser model

on:
  workflow_dispatch:
  push:
    branches: [firebase-hosting]
    paths: [.github/workflows/install-wlasl2000.yml]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firebase-hosting
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the official model and split manifest
        run: |
          python -m pip install --disable-pip-version-check numpy
          curl -fL --retry 3 -o /tmp/archived.zip 'https://drive.usercontent.google.com/download?id=1dzvocsaylRsjqaY4r_lyRihPZn0I6AA_&export=download&confirm=t'
          curl -fL --retry 3 -o /tmp/splits.zip 'https://drive.usercontent.google.com/download?id=16CWkbMLyEbdBkrxAPaxSXFP_aSxKzNN4&export=download&confirm=t'
          unzip -q /tmp/archived.zip -d /tmp/wlasl-checkpoints
          unzip -q /tmp/splits.zip -d /tmp/wlasl-splits

      - name: Export and commit the browser model
        run: |
          python training/export_wlasl1000_tgcn.py \
            /tmp/wlasl-checkpoints/archived/asl2000/ckpt.pth \
            /tmp/wlasl-splits/splits/asl2000.json \
            --output public/models/asl2000-tgcn \
            --verify-random 12
          git add public/models/asl2000-tgcn
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: install official WLASL2000 browser model'
          git push
