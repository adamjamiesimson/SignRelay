name: Read frozen training generalisation evidence
on:
  push:
    branches: [codex/asl-fingerspelling-2026-10-31]
    paths: ['.github/workflows/fingerspelling-accuracy-audit.yml']
permissions: {contents: read, actions: read}
jobs:
  read-frozen-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: accuracy-candidate-*
          path: frozen-training
          github-token: ${{ github.token }}
          run-id: 41274581796
      - shell: python
        run: |
          import hashlib,json,pathlib
          rows=[]
          for file in sorted(pathlib.Path("frozen-training").glob("*/report.json")):
           r=json.loads(file.read_text())
           assert hashlib.sha256((file.parent/"model.onnx").read_bytes()).hexdigest()==r["modelSha256"]
           rows.append({k:r[k] for k in ("experiment","trainingSource","modelSha256","bestEpoch","history","training","environment")})
          assert len(rows)==3
          print("FROZEN-TRAIN-GENERALISATION",json.dumps(rows),flush=True)
