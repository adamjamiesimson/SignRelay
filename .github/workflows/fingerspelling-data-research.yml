name: Fingerspelling real-data CTC pilot
on:
  push:
    branches: [codex/asl-fingerspelling-2026-10-31]
    paths: ['.github/workflows/fingerspelling-data-research.yml', 'training/fingerspelling/**', 'scripts/diagnostics/fingerspelling-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fingerspelling-real-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-ctc:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install native MediaPipe runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libgles2 libegl1 libgl1
      - name: Install CPU training environment
        run: |
          python -m pip install --disable-pip-version-check -r training/fingerspelling/requirements.txt
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify raw publisher clips; re-extract with pinned app task
        run: python training/fingerspelling/prepare.py --train 512 --validation 64 --test 96 --workers 2
      - name: Train independent small CTC; sealed signer-disjoint test; ONNX parity
        run: python training/fingerspelling/train.py --epochs 100
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - name: Install existing browser runtime and run real held-out worker parity
        run: |
          npm ci
          node scripts/copy-onnx-runtime.mjs
          chrome="$(command -v google-chrome || command -v chromium)"
          node scripts/diagnostics/fingerspelling-browser.mjs "$chrome"
      - name: Preserve candidate and aggregate evidence only, never media/keypoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsboard-independent-ctc-candidate
          path: |
            work/fingerspelling-candidate/model.onnx
            work/fingerspelling-candidate/model.pt
            work/fingerspelling-candidate/report.json
            work/fingerspelling-candidate/provenance.json
            work/fingerspelling-candidate/vocabulary.json
            work/fingerspelling-candidate/browser-report.json
          if-no-files-found: warn
          retention-days: 14
