name: Temporary ASLLVD browser benchmark

on:
  push:
    branches:
      - feature/pretrained-language-expansion

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare frozen ASLLVD fixtures
        run: npm run eval:fetch-asllvd

      - name: Build Firebase export
        run: npm run build:firebase

      - name: Run real browser recognition pipeline
        run: npm run eval:video -- evaluation/asllvd-v1.local.jsonl --tail 3000 --trial-timeout 30000

      - name: Print benchmark report
        if: always()
        run: |
          if [ -f work/video-evaluation/report.md ]; then
            cat work/video-evaluation/report.md
          fi

      - name: Upload metadata-only benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asllvd-v1-browser-report
          path: |
            work/video-evaluation/results.jsonl
            work/video-evaluation/report.md
          if-no-files-found: warn
          retention-days: 14
