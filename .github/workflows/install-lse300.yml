name: Build SWL-LSE Spanish Sign Language browser model

on:
  workflow_dispatch:
  push:
    branches: [firebase-hosting]
    paths:
      - .github/workflows/install-lse300.yml
      - training/train_swl_lse_onnx.py
      - scripts/activate-lse-model.mjs
      - training/lse-requirements.txt
      - training/download_swl_lse.py

permissions:
  contents: write

concurrency:
  group: lse-model-training
  cancel-in-progress: false

jobs:
  train-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firebase-hosting
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install compatible training dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r training/lse-requirements.txt
          python -c "from mediapipe.framework.formats.landmark_pb2 import NormalizedLandmarkList; import pickle; pickle.loads(pickle.dumps(NormalizedLandmarkList()))"
          python -m unittest discover -s training -p 'test_swl_lse.py'
          python -m unittest discover -s training -p 'test_model_download.py'
          npm ci

      - name: Download official SWL-LSE landmarks and annotations
        run: |
          mkdir -p /tmp/swl-lse
          # Bounded ranges avoid repeatedly requesting one 3.5 GB response.
          python training/download_swl_lse.py /tmp/swl-lse
          # Published file checksums for the pinned Zenodo release.
          cd /tmp/swl-lse
          md5sum --check <<'CHECKSUMS'
          e128df76232e0c7dcd7a74935cd38335  MEDIAPIPE.zip
          b235d2e43b8ef0f9e83e6f485cd8e68e  ANNOTATIONS.zip
          2df5f818fe6550f60abf8af2edaea2c1  videos_ref_annotations.csv
          CHECKSUMS
          unzip -q /tmp/swl-lse/ANNOTATIONS.zip -d /tmp/swl-lse/annotations
          unzip -q /tmp/swl-lse/MEDIAPIPE.zip -d /tmp/swl-lse/mediapipe

      - name: Train and export the 300-sign browser model
        run: |
          # The release archive contains its CSV files in an ANNOTATIONS/
          # directory, so pass that extracted directory rather than the ZIP
          # destination itself.
          python training/train_swl_lse_onnx.py /tmp/swl-lse/mediapipe /tmp/swl-lse/annotations/ANNOTATIONS /tmp/swl-lse/videos_ref_annotations.csv --epochs 24

      - name: Mark the model installed and commit it
        run: |
          node scripts/activate-lse-model.mjs
          npm run build:firebase
          npm test
          npm run lint
          git config user.name 'signrelay-model-bot'
          git config user.email 'signrelay-model-bot@users.noreply.github.com'
          git add public/models/lse300-swl lib/model-adapters.ts public/workers/recognition.worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'assets: install trained SWL-LSE Spanish browser model'
          git pull --rebase origin firebase-hosting
          git push origin HEAD:firebase-hosting
