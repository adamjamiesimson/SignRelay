name: Full Firebase verification

on:
  push:
    branches:
      - feature/pretrained-language-expansion

permissions:
  contents: read

concurrency:
  group: full-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build:firebase
      - run: npm run test:rendered
      - run: npm run audit:secrets
      - run: npm run repo:guard
