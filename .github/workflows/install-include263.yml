name: Export official INCLUDE-263 ISL browser model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and export the official ISL model
        run: |
          python -m pip install --disable-pip-version-check torch onnx
          curl -fL --retry 3 -o /tmp/include263.pth 'https://api.wandb.ai/files/abdur-ai4bharat/include-no-cnn/2kuznb3t/augs_transformer.pth'
          curl -fL --retry 3 -o /tmp/include-labels.json 'https://raw.githubusercontent.com/AI4Bharat/INCLUDE/master/label_maps/label_map.json'
          python training/export_include263_onnx.py /tmp/include263.pth /tmp/include-labels.json
          test -f public/models/isl263-include/model.onnx
          test -f public/models/isl263-include/labels.json

      - name: Upload model for explicit review
        uses: actions/upload-artifact@v4
        with:
          name: include263-browser-model
          path: public/models/isl263-include/
          retention-days: 14
