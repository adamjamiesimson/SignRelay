name: Install official BSL-1064 browser model

on:
  workflow_dispatch:
  push:
    branches: [firebase-hosting]
    paths: [.github/workflows/install-bsl1064.yml, training/export_bsl1k_pose2sign_onnx.py]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firebase-hosting
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and export the official BSL model
        run: |
          python -m pip install --disable-pip-version-check torch onnx
          curl -fL --retry 3 -o /tmp/bsl1064.pth.tar 'https://www.robots.ox.ac.uk/~vgg/research/bsl1k/data/experiments/bsl1k_pose2sign_m8_l24_kws8_ps_bodyhands/model.pth.tar'
          curl -fL --retry 3 -o /tmp/bsl1k_vocab.pkl 'https://raw.githubusercontent.com/gulvarol/bsl1k/master/misc/bsl1k/bsl1k_vocab.pkl'
          python training/export_bsl1k_pose2sign_onnx.py /tmp/bsl1064.pth.tar /tmp/bsl1k_vocab.pkl
      - name: Commit the browser model
        run: |
          git config user.name "signrelay-model-bot"
          git config user.email "signrelay-model-bot@users.noreply.github.com"
          git add public/models/bsl1064-pose2sign
          git diff --cached --quiet || git commit -m "assets: install official BSL1064 Pose2Sign browser model"
          git push
