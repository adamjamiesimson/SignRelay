name: Korean research model verification

on:
  workflow_dispatch:
  push:
    branches: [feature/pretrained-language-expansion]
    paths:
      - .github/workflows/ksl-research-check.yml
      - training/export_ksl_onnx.py
      - training/evaluate_ksl_clips.py
      - training/fetch_ksl_research_assets.py

# This workflow evaluates downloaded research models and uploads JSON reports.
# It has no deployment step or repository write permission.
permissions:
  contents: read

concurrency:
  group: ksl-research-check
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model and tracker dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgles2 libegl1 libgl1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 protobuf==4.25.9 mediapipe==0.10.35 onnx==1.17.0 onnxruntime==1.20.1 opencv-contrib-python==4.11.0.86

      - name: Download and verify pinned research assets
        run: python training/fetch_ksl_research_assets.py

      - name: Export model and verify numerical equivalence
        run: python training/export_ksl_onnx.py work/ksl-research/source --output work/ksl-research/export

      - name: Evaluate the three fixed clips with the publisher's Tasks tracker
        run: |
          python training/evaluate_ksl_clips.py work/ksl-research/source work/ksl-research/export work/ksl-research/clips \
            --output work/ksl-research/reports/tasks-clips.json \
            --dataset-source https://huggingface.co/datasets/Seoyoung07/korean-sign-word-classifier-mediapipe-test-100/tree/5dc76d221db9b74cc719cbbfb7528c7b5ec6a56d \
            --tasks

      - name: Preserve verification reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksl-research-reports
          path: |
            work/ksl-research/export/verification.json
            work/ksl-research/reports/tasks-clips.json
          if-no-files-found: warn
          retention-days: 7
