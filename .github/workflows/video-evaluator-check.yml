name: Temporary video evaluator check

on:
  push:
    branches:
      - feature/video-regression-evaluation

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: node --check scripts/evaluate-video-regressions.mjs
      - run: npm ci
      - run: npx eslint scripts/evaluate-video-regressions.mjs
