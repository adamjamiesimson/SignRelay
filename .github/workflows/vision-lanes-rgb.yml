name: Vision lane comparison on licensed RGB
on:
  pull_request:
    paths:
      - '.github/workflows/vision-lanes-rgb.yml'
      - 'scripts/diagnostics/*vision-lanes*'
      - 'scripts/diagnostics/vision-split.worker.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0', cache: npm}
      - name: Install RGB decoding dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libgles2 libegl1 libgl1 ffmpeg
      - run: python -m pip install --disable-pip-version-check -r training/fingerspelling/requirements.txt
      - name: Verify and decode the existing exposed FSboard cohort
        run: python scripts/diagnostics/tracking-determinism-prepare.py
      - run: npm ci && npm run install:vision-assets
      - name: Compare combined and split lanes on identical RGB
        run: node scripts/diagnostics/run-vision-lanes.mjs "$(command -v google-chrome)" outputs/vision-lanes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vision-lanes-aggregate, path: outputs/vision-lanes.json, retention-days: 14}
