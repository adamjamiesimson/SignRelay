name: Private ASL Capture Browser Smoke
# Synthetic webcam checks only. No participant media, holdout, or upload.
on:
  pull_request:
    paths:
      - 'app/field-test/**'
      - 'lib/field-test-capture.ts'
      - 'scripts/exclude-private-routes.mjs'
      - 'tests/field-test-browser-smoke.mjs'
      - 'tests/field-test-capture.test.ts'
      - '.github/workflows/field-test-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running build. Pushes
# to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Validate capture slot contracts
        run: npx vitest run tests/field-test-capture.test.ts
      - name: Restore the verified RSL model from the CI cache
        id: rsl-cache
        uses: actions/cache/restore@v4
        with:
          path: public/models/rsl1000-slovo/model.onnx
          key: rsl-model-${{ hashFiles('public/models/rsl1000-slovo/manifest.json') }}

      # External download with bounded retries. The size and SHA-256 are always
      # checked, cached copy included. Exit 75: the host could not deliver the
      # model (not a code failure). Exit 65: wrong bytes, refused (fail closed).
      - name: Acquire and verify the RSL model (external download)
        run: npm run install:rsl-model

      - name: Save the verified RSL model to the CI cache
        if: steps.rsl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/models/rsl1000-slovo/model.onnx
          key: ${{ steps.rsl-cache.outputs.cache-primary-key }}

      - name: Build development export that includes the private capture route
        env:
          SIGNRELAY_INCLUDE_PRIVATE_CAPTURE: "1"
        run: npm run build:firebase
      - name: Validate no-upload, download, metadata and interruption controls
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          node tests/field-test-browser-smoke.mjs "$chrome"
