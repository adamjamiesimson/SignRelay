name: PopSign ASL limited real-video smoke benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/evaluate-video-regressions.mjs'
      - 'scripts/fetch-commons-negative-fixtures.mjs'
      - 'workers/recognition.worker.ts'
      - 'lib/vision-types.ts'
      - 'training/prepare_popsign_eval.py'
      - '.github/workflows/popsign-limited-video-smoke.yml'

permissions:
  contents: read

concurrency:
  group: popsign-asl-limited-smoke
  cancel-in-progress: true

jobs:
  limited-video-benchmark:
    if: github.head_ref == 'feature/video-eval-quality-gates-2026-10-09'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test evaluator and Python fixture preparation
        run: |
          npm run test:video-evaluator
          python3 -m py_compile training/prepare_popsign_eval.py

      - name: Build the actual Firebase export for replay
        run: npm run build:firebase

      - name: Verify headless Chrome
        run: google-chrome --version || chromium --version

      - name: Fetch small held-out PopSign ASL sample
        run: |
          python3 training/prepare_popsign_eval.py \
            --dataset popsign_v1_0 \
            --category game \
            --split test \
            --per-sign 2 \
            --target hello=HELLO \
            --target thankyou='THANK YOU' \
            --target no=NO \
            --target yes=YES \
            --target please=PLEASE \
            --output-dir evaluation/videos/popsign \
            --manifest evaluation/popsign-test.local.jsonl
          wc -l evaluation/popsign-test.local.jsonl

      - name: Add licensed real-world non-sign gesture controls
        run: node scripts/fetch-commons-negative-fixtures.mjs evaluation/popsign-test.local.jsonl

      - name: Validate local fixture list
        run: npm run eval:video -- evaluation/popsign-test.local.jsonl --preflight

      - name: Replay first pass through real browser
        run: |
          npm run eval:video -- evaluation/popsign-test.local.jsonl \
            --language asl \
            --source-frames-only \
            --trial-timeout 25000 \
            --camera-timeout 120000 \
            --tail 3500 \
            --output work/popsign/pass-a/results.jsonl \
            --report work/popsign/pass-a/report.md

      - name: Replay identical video fixtures a second time
        run: |
          npm run eval:video -- evaluation/popsign-test.local.jsonl \
            --language asl \
            --source-frames-only \
            --trial-timeout 25000 \
            --camera-timeout 120000 \
            --tail 3500 \
            --output work/popsign/pass-b/results.jsonl \
            --report work/popsign/pass-b/report.md

      - name: Compare frame counts and recognition consistency
        run: node scripts/compare-video-runs.mjs work/popsign/pass-a/results.jsonl work/popsign/pass-b/results.jsonl work/popsign/repeatability.md

      - name: Preserve evaluation-only provenance and reports
        if: always()
        run: |
          mkdir -p work/popsign
          cat > work/popsign/SOURCE.txt <<'EOF'
          PopSign ASL v1.0, test split, "game" category; CC BY 4.0.
          Georgia Tech Contextual Computing Group and Deaf Professional Arts Network.
          https://signdata.cc.gatech.edu/view/datasets/popsign_v1_0/
          Five predetermined target signs, up to two signer-distinct clips each.
          Non-sign-intent controls from Wikimedia Commons: HandWaveExample.webm
          NMu11er, CC BY-SA 4.0; Fish on hand.webm, KEmel49, CC BY-SA 4.0.
          https://commons.wikimedia.org/wiki/File:HandWaveExample.webm
          https://commons.wikimedia.org/wiki/File:Fish_on_hand.webm
          Some ordinary waving overlaps visually with signed HELLO; interpret cautiously.
          Frame mode for this run: source-frames-only (one requestFrame per source advancement).
          Preliminary software regression smoke test; not a representative accuracy estimate.
          Raw video/landmarks not included in artifact.
          EOF
          if [ -f evaluation/popsign-test.local.jsonl ]; then
            cp evaluation/popsign-test.local.jsonl work/popsign/manifest.jsonl
          fi
          rm -rf evaluation/videos/popsign evaluation/videos/commons-negatives out/__eval__

      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popsign-asl-limited-video-report
          path: work/popsign/
          retention-days: 14
          if-no-files-found: warn
