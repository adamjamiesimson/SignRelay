name: Temporary HaGRID negative discovery

on:
  push:
    branches:
      - feature/asl-negative-benchmark

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Hugging Face dataset server
        shell: bash
        run: |
          set -euo pipefail
          url='https://datasets-server.huggingface.co/first-rows?dataset=cj-mills%2Fhagrid-classification-512p-no-gesture-150k&config=default&split=train'
          curl -fsSL --retry 3 "$url" -o /tmp/rows.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/rows.json'))
          print('FEATURES', json.dumps(d.get('features')))
          rows=d.get('rows',[])
          print('ROW_COUNT',len(rows))
          for row in rows[:3]:
              print('ROW',json.dumps(row)[:3000])
          PY
      - name: Locate no_gesture block by indexed rows
        shell: bash
        run: |
          set -euo pipefail
          base='https://datasets-server.huggingface.co/rows?dataset=cj-mills%2Fhagrid-classification-512p-no-gesture-150k&config=default&split=train'
          for offset in 35000 40000 45000 50000 55000 60000 65000; do
            curl -fsSL --retry 3 "$base&offset=$offset&length=3" -o "/tmp/rows-$offset.json"
            python - "$offset" "/tmp/rows-$offset.json" <<'PY'
          import json,sys
          off=int(sys.argv[1]); d=json.load(open(sys.argv[2]))
          labels=[r.get('row',{}).get('label') for r in d.get('rows',[])]
          print('OFFSET',off,'LABELS',labels)
          PY
          done
