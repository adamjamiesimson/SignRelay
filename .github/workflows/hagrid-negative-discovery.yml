name: Temporary HaGRID negative discovery

on:
  push:
    branches:
      - feature/asl-negative-benchmark

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Hugging Face dataset server
        shell: bash
        run: |
          set -euo pipefail
          url='https://datasets-server.huggingface.co/first-rows?dataset=cj-mills%2Fhagrid-classification-512p-no-gesture-150k&config=default&split=train'
          curl -fsSL --retry 3 "$url" -o /tmp/rows.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/rows.json'))
          print('FEATURES', json.dumps(d.get('features')))
          rows=d.get('rows',[])
          print('ROW_COUNT',len(rows))
          for row in rows[:3]:
              print('ROW',json.dumps(row)[:3000])
          PY
      - name: Locate no_gesture block by indexed rows
        shell: bash
        run: |
          set -euo pipefail
          base='https://datasets-server.huggingface.co/rows?dataset=cj-mills%2Fhagrid-classification-512p-no-gesture-150k&config=default&split=train'
          for offset in 35000 40000 45000 50000 55000 60000 65000; do
            curl -fsSL --retry 3 "$base&offset=$offset&length=3" -o "/tmp/rows-$offset.json"
            python - "$offset" "/tmp/rows-$offset.json" <<'PY'
          import json,sys
          off=int(sys.argv[1]); d=json.load(open(sys.argv[2]))
          labels=[r.get('row',{}).get('label') for r in d.get('rows',[])]
          print('OFFSET',off,'LABELS',labels)
          PY
          done

      - name: Freeze spaced no_gesture source images
        shell: bash
        run: |
          set -euo pipefail
          base='https://datasets-server.huggingface.co/rows?dataset=cj-mills%2Fhagrid-classification-512p-no-gesture-150k&config=default&split=train'
          mkdir -p /tmp/hagrid-neg
          for offset in 45000 50000 55000 60000 65000; do
            curl -fsSL --retry 3 "$base&offset=$offset&length=1" -o "/tmp/hagrid-neg/row-$offset.json"
            src=$(python - "$offset" "/tmp/hagrid-neg/row-$offset.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[2])); row=d['rows'][0]
          assert row['row']['label']==6, (sys.argv[1],row['row']['label'])
          print(row['row']['image']['src'])
          PY
            )
            curl -fsSL --retry 3 "$src" -o "/tmp/hagrid-neg/$offset.jpg"
            bytes=$(wc -c < "/tmp/hagrid-neg/$offset.jpg" | tr -d ' ')
            sha=$(sha256sum "/tmp/hagrid-neg/$offset.jpg" | awk '{print $1}')
            dims=$(python - "$offset" "/tmp/hagrid-neg/row-$offset.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[2])); image=d['rows'][0]['row']['image']
          print(f"{image['width']}x{image['height']}")
          PY
            )
            echo "HAGRID_NEG offset=$offset bytes=$bytes sha256=$sha dims=$dims src=$src"
          done
