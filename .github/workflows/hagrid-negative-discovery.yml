name: Temporary HaGRID negative verification

on:
  push:
    branches:
      - feature/asl-negative-benchmark

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: node --check scripts/fetch-hagrid-negatives.mjs
      - run: npm run eval:fetch-hagrid-negatives
      - name: Inspect generated manifest
        run: |
          test "$(wc -l < evaluation/hagrid-no-gesture-v1.local.jsonl)" -eq 10
          cat evaluation/hagrid-no-gesture-v1.local.jsonl
