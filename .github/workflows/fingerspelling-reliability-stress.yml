name: Fingerspelling derived-input stress probes
on:
  push:
    branches: [codex/fingerspelling-reliability-2026-11-01]
    paths: ['.github/workflows/fingerspelling-reliability-stress.yml']
permissions: {contents: read, actions: read}
jobs:
  declared-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {OMP_NUM_THREADS: '2', OPENBLAS_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==1.26.4 onnxruntime==1.24.4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41285144707
          name: upright-final-evidence-and-browser-inputs
          path: work/upright-evaluation
      - run: python training/fingerspelling/reliability/stress.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: reliability-derived-stress, path: outputs/reliability-derived-stress.json}
