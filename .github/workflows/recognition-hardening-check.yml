name: Recognition hardening check

on:
  push:
    branches:
      - feature/recognition-hardening-2026-10-02

permissions:
  contents: read

concurrency:
  group: recognition-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build:worker
      - run: node --check scripts/evaluate-video-regressions.mjs
      - run: python -m unittest training.test_pipeline
      - run: python -m py_compile training/pipeline.py training/extract_landmarks.py training/train_sequence.py
