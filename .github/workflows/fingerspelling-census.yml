name: Fingerspelling accuracy metadata census
on:
  push:
    branches: [codex/asl-fingerspelling-2026-10-31]
    paths: ['.github/workflows/fingerspelling-census.yml', 'training/fingerspelling/accuracy/census.py']
permissions: {contents: read}
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install kagglehub==0.3.13 numpy==1.26.4
      - run: python training/fingerspelling/accuracy/census.py
