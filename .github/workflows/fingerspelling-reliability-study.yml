name: Fingerspelling local-study privacy and trust verification
on:
  push:
    branches: [codex/fingerspelling-reliability-2026-11-01]
    paths: ['.github/workflows/fingerspelling-reliability-study.yml']
permissions: {contents: read}
jobs:
  participant-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0', cache: npm}
      - run: sudo apt-get update -qq && sudo apt-get install -y libgles2 libegl1 libgl1 ffmpeg
      - run: python -m pip install --disable-pip-version-check -r training/fingerspelling/requirements.txt
      - run: npm ci
      - run: npm run build:rehearsal
      - run: python scripts/diagnostics/fingerspelling-camera-prepare.py 6befb92aee4dcad7bf6ed904
      - run: node scripts/diagnostics/fingerspelling-camera-browser.mjs "$(command -v google-chrome)" 6befb92aee4dcad7bf6ed904 research
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: reliability-study-browser, path: outputs/fingerspelling-recorded-camera-*.json}
  source-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Existing publisher trust boundary; failure remains visible
        run: |
          bash training/complete_popsign_chain.sh "$RUNNER_TEMP/popsign-ca.pem"
          export SSL_CERT_FILE="$RUNNER_TEMP/popsign-ca.pem"
          PYTHONPATH=training python -c 'from secure_download import get; print("Verified listing bytes:",len(get("https://signdata.cc.gatech.edu/data/popsign_v1_0/game/test/")))'

# Download interception reads the local Blob directly and retains the production CSP.

# Use explicit input selection for corrected truth instead of a platform-dependent shortcut.

# Verify consent/export for abstention outcomes too; these are positive failures, not recognition success.
