name: Preserve display-aware evaluated weights as reviewable blobs only
on:
  push:
    branches: [codex/asl-fingerspelling-2026-10-31]
    paths: ['.github/workflows/fingerspelling-upright-preserve.yml']
permissions: {contents: read, actions: read}
jobs:
  require-frozen-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        shell: python
        run: |
          import json,os,time,urllib.request
          for attempt in range(60):
           req=urllib.request.Request("https://api.github.com/repos/adamjamiesimson/SignRelay/actions/runs/41285144707",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
           with urllib.request.urlopen(req,timeout=45) as response:r=json.load(response)
           if r["status"]=="completed":
            assert r["conclusion"]=="success"
            break
           time.sleep(20)
          else:raise RuntimeError("Bounded evaluation wait expired")
  preserve-frozen-artifact:
    needs: require-frozen-evaluation
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upright-final-evidence-and-browser-inputs
          path: frozen
          github-token: ${{ github.token }}
          run-id: 41285144707
      - uses: actions/download-artifact@v4
        with:
          name: upright-selected-frozen
          path: selected
          github-token: ${{ github.token }}
          run-id: 41285144707
      - name: Check source and create unreferenced blobs; never change any Git ref
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: python
        run: |
          import base64,collections,gzip,hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path("frozen");r=json.loads((root/"report.json").read_text())
          assert r["sourceCommit"]=="37f2ee03cde79422a4792ebff910f823994b1ee2"
          assert r["rgbPolicy"]=="display-matrix-v1"
          assert r["selection"]["planSha256"]=="56d12a13b86ca92d94e397c4cc65fe7f55d8a154d8a6b56a3f42b25a483217e7"
          model=(root/"model.onnx").read_bytes()
          assert len(model)==r["runtime"]["bytes"]<600000 and hashlib.sha256(model).hexdigest()==r["runtime"]["sha256"]
          assert len(r["predictions"]["final"]["selected"])==384
          provenance=json.loads(gzip.decompress((root/"provenance.json.gz").read_bytes()))
          by_id={row["id"]:row for row in provenance["rows"]}
          fixtures=[]
          for i in range(8):
           sample=json.loads((root/"browser"/(str(i)+".json")).read_text());row=by_id[sample["id"]]
           fixtures.append({k:row[k] for k in ("id","role","signer","sourceSplit","reference","rawSha256")})
          (root/"fixture-index.json").write_text(json.dumps(fixtures,indent=2))
          inventory={"rgbPolicy":r["rgbPolicy"],"planSha256":r["selection"]["planSha256"],
           "roles":dict(collections.Counter(row["role"] for row in provenance["rows"])),
           "displayRotationDegrees":dict(collections.Counter(str(next((s["rotation"] for s in row.get("displaySideData",[]) if "rotation" in s),0)) for row in provenance["rows"])),
           "decodedDisplayShapes":dict(collections.Counter(str(row.get("displayWidthHeight")) for row in provenance["rows"]))}
          (root/"rgb-inventory.json").write_text(json.dumps(inventory,indent=2))
          paths={root/"model.onnx":"public/models/asl-fingerspelling/fsboard-upright-v1.onnx",
           root/"report.json":"docs/fingerspelling/evidence/upright-final.json",
           root/"runtime.json":"docs/fingerspelling/evidence/upright-runtime.json",
           root/"selection.json":"docs/fingerspelling/evidence/upright-selection.json",
           root/"negatives.json":"docs/fingerspelling/evidence/upright-negatives.json",
           root/"provenance.json.gz":"docs/fingerspelling/evidence/upright-provenance.json.gz",
           root/"fixture-index.json":"docs/fingerspelling/evidence/upright-browser-fixture-index.json",
           root/"rgb-inventory.json":"docs/fingerspelling/evidence/upright-rgb-inventory.json",
           pathlib.Path("selected/report.json"):"docs/fingerspelling/evidence/upright-training.json"}
          for source,target in paths.items():
           blob=source.read_bytes()
           req=urllib.request.Request("https://api.github.com/repos/adamjamiesimson/SignRelay/git/blobs",data=json.dumps({"encoding":"base64","content":base64.b64encode(blob).decode()}).encode(),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"},method="POST")
           with urllib.request.urlopen(req,timeout=60) as response:value=json.load(response)
           print("REVIEWED-UPRIGHT-BLOB",json.dumps({"path":target,"sha":value["sha"],"bytes":len(blob),"sha256":hashlib.sha256(blob).hexdigest()}),flush=True)
          print("REVIEWED-UPRIGHT-RUNTIME",json.dumps(r["runtime"]),flush=True)
          print("REVIEWED-UPRIGHT-INVENTORY",json.dumps(inventory),flush=True)
          print("REVIEWED-UPRIGHT-TRAIN",json.dumps({"quality":json.loads(pathlib.Path("selected/report.json").read_text())["quality"],"metrics":json.loads(pathlib.Path("selected/report.json").read_text())["training"]}),flush=True)
